services:
  postgres:
    image: postgres:16-alpine
    container_name: biox-postgres
    environment:
      POSTGRES_USER: biox
      POSTGRES_PASSWORD: biox
      POSTGRES_DB: biox
    ports:
      - "5432:5432"
    volumes:
      - biox-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biox -d biox"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  biox-pgdata:
